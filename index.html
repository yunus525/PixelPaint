<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PixelPaint</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
    margin:0;width:100%;height:100%;overflow:hidden;
    background:#101216;color:#fff;font-family:Arial,sans-serif
}
button,input{font:inherit}
button{border:0;color:#fff;cursor:pointer}

#app{width:100%;height:100%;display:flex;flex-direction:column}

/* BAŞLANGIÇ */
#startScreen{
    position:fixed;inset:0;z-index:1000;
    display:flex;align-items:center;justify-content:center;
    padding:18px;
    background:radial-gradient(circle at top,#293044,#101216 65%)
}
.card{
    width:min(430px,100%);padding:24px;
    background:#191c22;border:1px solid #30343d;
    border-radius:18px;box-shadow:0 25px 70px rgba(0,0,0,.55)
}
.logo{text-align:center;font-size:30px;font-weight:bold}
.sub{margin:7px 0 22px;text-align:center;color:#999faa}
.field{margin-bottom:13px}
.field label{display:block;margin-bottom:6px;color:#b9bec8;font-size:13px}
.field input{
    width:100%;height:47px;padding:0 12px;
    background:#0e1014;color:white;border:1px solid #383d47;
    border-radius:8px;outline:none
}
.field input:focus{border-color:#3479ff}
.quickTitle{margin:17px 0 8px;color:#aaa;font-size:13px}
.quickGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.quick{min-height:41px;background:#252932;border-radius:8px}
.quick:active{background:#3479ff}
#createBtn{
    width:100%;height:50px;margin-top:18px;
    background:#3479ff;border-radius:9px;font-weight:bold
}
#error{min-height:18px;margin-top:9px;color:#ff6262;text-align:center;font-size:13px}

/* TOOLBAR */
#toolbar{
    flex:0 0 auto;padding:6px;background:#181a1f;
    border-bottom:1px solid #30343b;overflow-x:auto;
    overflow-y:hidden;scrollbar-width:none;touch-action:pan-x
}
#toolbar::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;gap:6px;min-width:max-content}
.tool{
    height:41px;min-width:48px;padding:0 10px;
    background:#262a32;border-radius:8px;white-space:nowrap
}
.tool.active{background:#3479ff}
.tool:active{transform:scale(.97)}

.sizeBox{
    height:41px;display:flex;align-items:center;gap:4px;
    padding:4px;background:#262a32;border-radius:8px
}
.sizeBtn{
    width:35px;height:33px;background:#363b45;
    border-radius:7px;font-size:20px
}
#sizeText{width:55px;text-align:center;font-size:12px}

#activeColorBtn{
    width:38px;height:38px;border-radius:50%;
    border:2px solid white;box-shadow:0 0 0 2px #3479ff;
    padding:0;flex-shrink:0
}

/* RENK */
#colorModal{
    position:fixed;inset:0;z-index:2000;
    background:rgba(0,0,0,.7);display:none;
    align-items:center;justify-content:center;padding:16px
}
.colorModalCard{
    width:min(360px,100%);background:#1b1e25;
    border:1px solid #30343d;border-radius:16px;padding:20px;
    display:flex;flex-direction:column;align-items:center;
    box-shadow:0 20px 50px rgba(0,0,0,.6)
}
.colorModalTitle{font-size:16px;font-weight:bold;margin-bottom:14px;color:#ddd}
#wheelContainer{
    position:relative;width:220px;height:220px;
    margin-bottom:15px;border-radius:50%;
    cursor:crosshair;box-shadow:0 4px 15px rgba(0,0,0,.4)
}
#colorWheelCanvas{width:100%;height:100%;border-radius:50%;display:block}
#wheelCursor{
    position:absolute;width:14px;height:14px;border:2px solid white;
    border-radius:50%;box-shadow:0 0 3px #000;
    transform:translate(-50%,-50%);pointer-events:none;display:none
}
.sliderField{width:100%;margin-bottom:15px}
.sliderField label{font-size:12px;color:#aaa;display:block;margin-bottom:5px}
.sliderField input{width:100%;accent-color:#3479ff}
.hexField{
    width:100%;display:flex;align-items:center;gap:8px;margin-bottom:15px
}
.hexField label{font-size:12px;color:#aaa}
.hexField input{
    flex:1;height:36px;background:#0e1014;border:1px solid #383d47;
    border-radius:6px;color:white;text-align:center;
    font-family:monospace;font-size:14px;outline:none
}
.presetLabel{font-size:12px;color:#aaa;align-self:flex-start;margin-bottom:6px}
.presetGrid{
    display:grid;grid-template-columns:repeat(7,1fr);
    gap:8px;width:100%;margin-bottom:20px
}
.presetColor{
    width:100%;aspect-ratio:1;border-radius:50%;
    border:2px solid transparent
}
.presetColor:hover{transform:scale(1.1);border-color:white}
#closeColorModal{
    width:100%;height:42px;background:#3479ff;
    border-radius:8px;font-weight:bold
}

/* ÇALIŞMA ALANI */
#workspace{
    position:relative;flex:1;min-height:0;overflow:hidden;
    background-color:#17191e;
    background-image:
        linear-gradient(45deg,#1e2127 25%,transparent 25%),
        linear-gradient(-45deg,#1e2127 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#1e2127 75%),
        linear-gradient(-45deg,transparent 75%,#1e2127 75%);
    background-size:24px 24px;
    background-position:0 0,0 12px,12px -12px,-12px 0;
    touch-action:none
}
#canvasWrap{
    position:absolute;left:0;top:0;
    transform-origin:0 0;
    box-shadow:0 15px 50px rgba(0,0,0,.6);
    will-change:transform
}
#paintCanvas{
    display:block;background:white;
    image-rendering:pixelated;
    touch-action:none;user-select:none;
    -webkit-user-select:none
}
#status{
    position:absolute;left:8px;bottom:8px;
    padding:5px 8px;background:rgba(0,0,0,.65);
    border-radius:6px;color:#ddd;font-size:12px;
    pointer-events:none;z-index:10
}
</style>
</head>

<body>

<div id="app">

<div id="startScreen">
    <div class="card">
        <div class="logo">PixelPaint</div>
        <div class="sub">Yeni çizim oluştur</div>

        <div class="field">
            <label>Genişlik — 16 ile 4096 px</label>
            <input id="widthInput" type="number" min="16" max="4096" value="800">
        </div>

        <div class="field">
            <label>Yükseklik — 16 ile 4096 px</label>
            <input id="heightInput" type="number" min="16" max="4096" value="600">
        </div>

        <div class="quickTitle">Hazır boyutlar</div>

        <div class="quickGrid">
            <button class="quick" data-w="16" data-h="16">16 × 16</button>
            <button class="quick" data-w="32" data-h="32">32 × 32</button>
            <button class="quick" data-w="64" data-h="64">64 × 64</button>
            <button class="quick" data-w="128" data-h="128">128 × 128</button>
            <button class="quick" data-w="256" data-h="256">256 × 256</button>
            <button class="quick" data-w="800" data-h="600">800 × 600</button>
            <button class="quick" data-w="1280" data-h="720">1280 × 720</button>
            <button class="quick" data-w="1920" data-h="1080">1920 × 1080</button>
        </div>

        <button id="createBtn">CANVAS OLUŞTUR</button>
        <div id="error"></div>
    </div>
</div>

<div id="toolbar">
    <div class="row">

        <button id="activeColorBtn" title="Renk Paleti"></button>

        <button id="brushBtn" class="tool active">Kalem</button>
        <button id="eraserBtn" class="tool">Silgi</button>
        <button id="lineBtn" class="tool">Çizgi</button>
        <button id="rectBtn" class="tool">Dikdörtgen</button>
        <button id="ellipseBtn" class="tool">Daire</button>
        <button id="fillBtn" class="tool">Dolgu</button>
        <button id="pickerBtn" class="tool">Renk Seç</button>

        <div class="sizeBox">
            <button id="sizeDown" class="sizeBtn">−</button>
            <div id="sizeText">12 px</div>
            <button id="sizeUp" class="sizeBtn">+</button>
        </div>

        <button id="rotateBtn" class="tool">↻ Döndür</button>
        <button id="undoBtn" class="tool">Geri</button>
        <button id="redoBtn" class="tool">İleri</button>
        <button id="saveBtn" class="tool">Kaydet</button>
        <button id="loadBtn" class="tool">Yükle</button>
        <input id="fileInput" type="file" accept="image/*" hidden>

        <button id="fullscreenBtn" class="tool">Tam Ekran</button>
        <button id="newBtn" class="tool">Yeni</button>

    </div>
</div>

<div id="workspace">
    <div id="canvasWrap">
        <canvas id="paintCanvas"></canvas>
    </div>
    <div id="status">800 × 600 px</div>
</div>

</div>

<div id="colorModal">
    <div class="colorModalCard">

        <div class="colorModalTitle">Renk Seçimi</div>

        <div id="wheelContainer">
            <canvas id="colorWheelCanvas"></canvas>
            <div id="wheelCursor"></div>
        </div>

        <div class="sliderField">
            <label>Parlaklık</label>
            <input id="brightnessRange" type="range" min="0" max="100" value="100">
        </div>

        <div class="hexField">
            <label>HEX:</label>
            <input id="hexInput" type="text" value="#111111" maxlength="7">
        </div>

        <div class="presetLabel">Hazır Renkler</div>
        <div class="presetGrid" id="presetColorsGrid"></div>

        <button id="closeColorModal">Tamam</button>
    </div>
</div>

<script>
"use strict";

/* ELEMENTLER */
const canvas = document.getElementById("paintCanvas");
const ctx = canvas.getContext("2d", {alpha:false});

const workspace = document.getElementById("workspace");
const canvasWrap = document.getElementById("canvasWrap");

const startScreen = document.getElementById("startScreen");
const widthInput = document.getElementById("widthInput");
const heightInput = document.getElementById("heightInput");
const createBtn = document.getElementById("createBtn");
const errorBox = document.getElementById("error");
const status = document.getElementById("status");

const sizeText = document.getElementById("sizeText");
const fileInput = document.getElementById("fileInput");

let canvasCreated = false;

let tool = "brush";
let color = "#111111";
let brushSize = 12;

let scale = 1;
let panX = 0;
let panY = 0;
let rotation = 0;

let drawing = false;
let activeDrawPointer = null;

let startX = 0;
let startY = 0;
let lastX = 0;
let lastY = 0;

let preview = null;

/* HISTORY */
const history = [];
let historyIndex = -1;
const MAX_HISTORY = 30;

/* MULTI TOUCH */
const pointers = new Map();

let gesture = null;

/*
    ÖNEMLİ:
    Döndürme/zoom sırasında hiçbir çizim yapılmaz.
    2 parmak devreye girdiğinde çizim tamamen iptal edilir.
*/

/* RENK */
const colorModal = document.getElementById("colorModal");
const activeColorBtn = document.getElementById("activeColorBtn");

const colorWheelCanvas = document.getElementById("colorWheelCanvas");
const wheelCtx = colorWheelCanvas.getContext("2d");
const wheelCursor = document.getElementById("wheelCursor");

const brightnessRange = document.getElementById("brightnessRange");
const hexInput = document.getElementById("hexInput");
const presetColorsGrid = document.getElementById("presetColorsGrid");
const closeColorModal = document.getElementById("closeColorModal");

const wheelSize = 220;

colorWheelCanvas.width = wheelSize;
colorWheelCanvas.height = wheelSize;

function hsvToRgb(h,s,v){
    s/=100;
    v/=100;

    const c=v*s;
    const x=c*(1-Math.abs((h/60)%2-1));
    const m=v-c;

    let r=0,g=0,b=0;

    if(h<60){r=c;g=x}
    else if(h<120){r=x;g=c}
    else if(h<180){g=c;b=x}
    else if(h<240){g=x;b=c}
    else if(h<300){r=x;b=c}
    else{r=c;b=x}

    return {
        r:Math.round((r+m)*255),
        g:Math.round((g+m)*255),
        b:Math.round((b+m)*255)
    };
}

function drawColorWheel(){

    const radius=wheelSize/2;
    const img=wheelCtx.createImageData(wheelSize,wheelSize);

    for(let y=0;y<wheelSize;y++){
        for(let x=0;x<wheelSize;x++){

            const dx=x-radius;
            const dy=y-radius;
            const dist=Math.sqrt(dx*dx+dy*dy);

            if(dist<=radius){

                const angle=Math.atan2(dy,dx);

                const hue=(angle*180/Math.PI+360)%360;
                const saturation=(dist/radius)*100;
                const brightness=Number(brightnessRange.value);

                const rgb=hsvToRgb(hue,saturation,brightness);

                const i=(y*wheelSize+x)*4;

                img.data[i]=rgb.r;
                img.data[i+1]=rgb.g;
                img.data[i+2]=rgb.b;
                img.data[i+3]=255;
            }
        }
    }

    wheelCtx.putImageData(img,0,0);
}

drawColorWheel();

const presets=[
    "#000000","#ffffff","#ff0000","#ff6600","#ff9900","#ffcc00","#ffff00",
    "#00ff00","#00cc66","#00ffff","#00aaff","#0000ff","#9900ff","#ff00ff",
    "#ff6699","#795548","#9e9e9e","#607d8b","#32cd32","#8b4513","#4b0082"
];

function updateActiveColor(){

    activeColorBtn.style.background=color;
    hexInput.value=color;
}

presets.forEach(c=>{

    const b=document.createElement("button");

    b.className="presetColor";
    b.style.background=c;

    b.onclick=()=>{
        color=c;
        updateActiveColor();
        colorModal.style.display="none";
    };

    presetColorsGrid.appendChild(b);
});

updateActiveColor();

hexInput.oninput=()=>{

    let v=hexInput.value.trim();

    if(!v.startsWith("#")) v="#"+v;

    if(/^#[0-9a-fA-F]{6}$/.test(v)){

        color=v;
        activeColorBtn.style.background=color;
    }
};

brightnessRange.oninput=drawColorWheel;

activeColorBtn.onclick=()=>{
    colorModal.style.display="flex";
};

closeColorModal.onclick=()=>{
    colorModal.style.display="none";
};

/* COLOR WHEEL */
let pickingColor=false;

colorWheelCanvas.addEventListener("pointerdown",e=>{
    pickingColor=true;
    colorFromWheel(e);
});

window.addEventListener("pointermove",e=>{
    if(pickingColor) colorFromWheel(e);
});

window.addEventListener("pointerup",()=>{
    pickingColor=false;
});

function colorFromWheel(e){

    const r=colorWheelCanvas.getBoundingClientRect();

    const x=e.clientX-r.left;
    const y=e.clientY-r.top;

    const radius=wheelSize/2;
    const dx=x-radius;
    const dy=y-radius;

    if(Math.hypot(dx,dy)>radius)return;

    wheelCursor.style.display="block";
    wheelCursor.style.left=x+"px";
    wheelCursor.style.top=y+"px";

    const px=wheelCtx.getImageData(
        Math.floor(x),
        Math.floor(y),
        1,1
    ).data;

    color=rgbToHex(px[0],px[1],px[2]);

    updateActiveColor();
}

/* ARAÇLAR */
const brushBtn=document.getElementById("brushBtn");
const eraserBtn=document.getElementById("eraserBtn");
const lineBtn=document.getElementById("lineBtn");
const rectBtn=document.getElementById("rectBtn");
const ellipseBtn=document.getElementById("ellipseBtn");
const fillBtn=document.getElementById("fillBtn");
const pickerBtn=document.getElementById("pickerBtn");

const toolButtons=[
    brushBtn,
    eraserBtn,
    lineBtn,
    rectBtn,
    ellipseBtn,
    fillBtn,
    pickerBtn
];

function updateTools(){

    toolButtons.forEach(b=>b.classList.remove("active"));

    const map={
        brush:brushBtn,
        eraser:eraserBtn,
        line:lineBtn,
        rect:rectBtn,
        ellipse:ellipseBtn,
        fill:fillBtn,
        picker:pickerBtn
    };

    if(map[tool])map[tool].classList.add("active");
}

brushBtn.onclick=()=>{tool="brush";updateTools()};
eraserBtn.onclick=()=>{tool="eraser";updateTools()};
lineBtn.onclick=()=>{tool="line";updateTools()};
rectBtn.onclick=()=>{tool="rect";updateTools()};
ellipseBtn.onclick=()=>{tool="ellipse";updateTools()};
fillBtn.onclick=()=>{tool="fill";updateTools()};
pickerBtn.onclick=()=>{tool="picker";updateTools()};

/* BOYUT */
document.getElementById("sizeDown").onclick=()=>{
    brushSize=Math.max(1,brushSize-1);
    updateSize();
};

document.getElementById("sizeUp").onclick=()=>{
    brushSize=Math.min(200,brushSize+1);
    updateSize();
};

function updateSize(){
    sizeText.textContent=brushSize+" px";
}

/* CANVAS */
function createCanvas(w,h){

    w=Number(w);
    h=Number(h);

    if(
        !Number.isInteger(w) ||
        !Number.isInteger(h) ||
        w<16 || h<16 ||
        w>4096 || h>4096
    ){

        errorBox.textContent="Boyut 16 ile 4096 px arasında olmalı.";
        return false;
    }

    canvas.width=w;
    canvas.height=h;

    ctx.setTransform(1,0,0,1,0,0);
    ctx.imageSmoothingEnabled=false;

    ctx.fillStyle="#ffffff";
    ctx.fillRect(0,0,w,h);

    canvasCreated=true;

    history.length=0;
    historyIndex=-1;

    saveHistory();

    updateStatus();

    startScreen.style.display="none";

    errorBox.textContent="";

    resetView();

    return true;
}

document.querySelectorAll(".quick").forEach(btn=>{

    btn.onclick=()=>{
        widthInput.value=btn.dataset.w;
        heightInput.value=btn.dataset.h;
    };
});

createBtn.onclick=()=>{
    createCanvas(widthInput.value,heightInput.value);
};

document.getElementById("newBtn").onclick=()=>{
    startScreen.style.display="flex";
};

/* VIEW */
function resetView(){

    if(!canvasCreated)return;

    const w=workspace.clientWidth;
    const h=workspace.clientHeight;

    canvas.style.width=canvas.width+"px";
    canvas.style.height=canvas.height+"px";

    const sx=(w-40)/canvas.width;
    const sy=(h-40)/canvas.height;

    scale=Math.min(sx,sy,1);

    rotation=0;

    panX=(w-canvas.width*scale)/2;
    panY=(h-canvas.height*scale)/2;

    updateTransform();
}

function updateTransform(){

    canvasWrap.style.transform=
        `translate(${panX}px,${panY}px) `+
        `rotate(${rotation}deg) `+
        `scale(${scale})`;
}

window.addEventListener("resize",()=>{
    if(canvasCreated)updateTransform();
});

/* KOORDİNAT
   CSS transform yerine matematiksel ters dönüşüm kullanılıyor.
   Böylece döndürülmüş canvas üzerinde çizim doğru yere gider.
*/
function getPoint(e){

    const rect=workspace.getBoundingClientRect();

    const sx=e.clientX-rect.left;
    const sy=e.clientY-rect.top;

    const rad=-rotation*Math.PI/180;

    const dx=sx-panX;
    const dy=sy-panY;

    const rx=dx*Math.cos(rad)-dy*Math.sin(rad);
    const ry=dx*Math.sin(rad)+dy*Math.cos(rad);

    return {
        x:rx/scale,
        y:ry/scale
    };
}

/* ÇİZİM */
function drawBrush(x1,y1,x2,y2){

    ctx.save();

    /*
      SİLGİ BEYAZ BOYAR.
      Şeffaflık kullanmıyoruz.
    */
    ctx.globalCompositeOperation="source-over";

    if(tool==="eraser"){
        ctx.strokeStyle="#ffffff";
        ctx.fillStyle="#ffffff";
    }else{
        ctx.strokeStyle=color;
        ctx.fillStyle=color;
    }

    ctx.lineWidth=brushSize;
    ctx.lineCap="round";
    ctx.lineJoin="round";

    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();

    if(Math.abs(x1-x2)<0.001 && Math.abs(y1-y2)<0.001){

        ctx.beginPath();
        ctx.arc(x1,y1,brushSize/2,0,Math.PI*2);
        ctx.fill();
    }

    ctx.restore();
}

function drawShape(x1,y1,x2,y2){

    ctx.save();

    ctx.strokeStyle=color;
    ctx.lineWidth=brushSize;
    ctx.lineCap="round";
    ctx.lineJoin="round";

    if(tool==="line"){

        ctx.beginPath();
        ctx.moveTo(x1,y1);
        ctx.lineTo(x2,y2);
        ctx.stroke();

    }else if(tool==="rect"){

        const x=Math.min(x1,x2);
        const y=Math.min(y1,y2);

        ctx.strokeRect(
            x,
            y,
            Math.abs(x2-x1),
            Math.abs(y2-y1)
        );

    }else if(tool==="ellipse"){

        const cx=(x1+x2)/2;
        const cy=(y1+y2)/2;

        const rx=Math.abs(x2-x1)/2;
        const ry=Math.abs(y2-y1)/2;

        ctx.beginPath();
        ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
        ctx.stroke();
    }

    ctx.restore();
}

/* POINTER SİSTEMİ */
canvas.addEventListener("pointerdown",e=>{

    if(!canvasCreated)return;

    e.preventDefault();

    pointers.set(e.pointerId,{
        x:e.clientX,
        y:e.clientY
    });

    /*
      2. parmak geldi:
      - çizimi durdur
      - preview iptal
      - gesture başlat
    */
    if(pointers.size>=2){

        drawing=false;
        activeDrawPointer=null;
        preview=null;

        const pts=[...pointers.values()];

        const a=pts[0];
        const b=pts[1];

        const midX=(a.x+b.x)/2;
        const midY=(a.y+b.y)/2;

        gesture={
            distance:Math.hypot(b.x-a.x,b.y-a.y),
            angle:Math.atan2(b.y-a.y,b.x-a.x),
            midX,
            midY,
            scale,
            rotation,
            panX,
            panY
        };

        return;
    }

    /* sadece tek parmak */
    if(pointers.size!==1)return;

    activeDrawPointer=e.pointerId;

    try{
        canvas.setPointerCapture(e.pointerId);
    }catch(_){}

    const p=getPoint(e);

    if(
        p.x<0 ||
        p.y<0 ||
        p.x>canvas.width ||
        p.y>canvas.height
    ){
        activeDrawPointer=null;
        return;
    }

    /* RENK SEÇ */
    if(tool==="picker"){

        const x=Math.floor(p.x);
        const y=Math.floor(p.y);

        const px=ctx.getImageData(x,y,1,1).data;

        color=rgbToHex(px[0],px[1],px[2]);

        updateActiveColor();

        tool="brush";
        updateTools();

        activeDrawPointer=null;

        return;
    }

    /* DOLGU */
    if(tool==="fill"){

        floodFill(
            Math.floor(p.x),
            Math.floor(p.y)
        );

        saveHistory();

        activeDrawPointer=null;

        return;
    }

    drawing=true;

    startX=p.x;
    startY=p.y;

    lastX=p.x;
    lastY=p.y;

    if(
        tool==="line" ||
        tool==="rect" ||
        tool==="ellipse"
    ){

        preview=ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );
    }

    if(
        tool==="brush" ||
        tool==="eraser"
    ){

        drawBrush(
            p.x,
            p.y,
            p.x,
            p.y
        );
    }
},{passive:false});


canvas.addEventListener("pointermove",e=>{

    if(!canvasCreated)return;

    if(!pointers.has(e.pointerId))return;

    e.preventDefault();

    pointers.set(e.pointerId,{
        x:e.clientX,
        y:e.clientY
    });

    /* 2 PARMAK = SADECE VIEW */
    if(pointers.size>=2){

        drawing=false;
        activeDrawPointer=null;
        preview=null;

        const pts=[...pointers.values()];

        const a=pts[0];
        const b=pts[1];

        if(!gesture)return;

        const distance=Math.hypot(
            b.x-a.x,
            b.y-a.y
        );

        const angle=Math.atan2(
            b.y-a.y,
            b.x-a.x
        );

        const midX=(a.x+b.x)/2;
        const midY=(a.y+b.y)/2;

        if(gesture.distance>0){

            scale=gesture.scale*
                distance/gesture.distance;

            scale=Math.max(.1,Math.min(40,scale));

            const angleDiff=
                (angle-gesture.angle)*180/Math.PI;

            rotation=
                gesture.rotation+angleDiff;

            panX=
                gesture.panX+
                (midX-gesture.midX);

            panY=
                gesture.panY+
                (midY-gesture.midY);

            updateTransform();
        }

        return;
    }

    /* TEK PARMAK ÇİZİM */
    if(
        drawing &&
        activeDrawPointer===e.pointerId
    ){

        const p=getPoint(e);

        if(
            tool==="brush" ||
            tool==="eraser"
        ){

            drawBrush(
                lastX,
                lastY,
                p.x,
                p.y
            );

            lastX=p.x;
            lastY=p.y;

            return;
        }

        if(preview){

            ctx.putImageData(preview,0,0);

            drawShape(
                startX,
                startY,
                p.x,
                p.y
            );
        }
    }

},{passive:false});


function endPointer(e){

    pointers.delete(e.pointerId);

    /*
      2 parmak hareketinden çıktıktan sonra
      kesinlikle çizime devam etme.
    */
    if(pointers.size===0){
        gesture=null;
    }

    if(
        drawing &&
        activeDrawPointer===e.pointerId
    ){

        const p=getPoint(e);

        if(
            tool==="line" ||
            tool==="rect" ||
            tool==="ellipse"
        ){

            if(preview){
                ctx.putImageData(preview,0,0);
            }

            drawShape(
                startX,
                startY,
                p.x,
                p.y
            );
        }

        drawing=false;
        preview=null;
        activeDrawPointer=null;

        try{
            canvas.releasePointerCapture(e.pointerId);
        }catch(_){}

        saveHistory();
    }
}

canvas.addEventListener("pointerup",endPointer,{passive:false});
canvas.addEventListener("pointercancel",endPointer,{passive:false});
canvas.addEventListener("pointerleave",e=>{
    if(e.pointerType==="mouse" && drawing){
        endPointer(e);
    }
},{passive:false});

/* MOUSE ZOOM */
workspace.addEventListener("wheel",e=>{

    if(!canvasCreated)return;

    e.preventDefault();

    const oldScale=scale;

    let newScale=
        e.deltaY<0
        ?scale*1.15
        :scale/1.15;

    newScale=Math.max(.1,Math.min(40,newScale));

    const rect=workspace.getBoundingClientRect();

    const mx=e.clientX-rect.left;
    const my=e.clientY-rect.top;

    panX=
        mx-(mx-panX)*(newScale/oldScale);

    panY=
        my-(my-panY)*(newScale/oldScale);

    scale=newScale;

    updateTransform();

},{passive:false});

/* DÖNDÜR */
document.getElementById("rotateBtn").onclick=()=>{

    if(!canvasCreated)return;

    /*
      Butona basarken aktif çizim varsa bitir.
    */
    drawing=false;
    activeDrawPointer=null;
    preview=null;

    rotation=(rotation+90)%360;

    updateTransform();
};

/* HISTORY */
function saveHistory(){

    if(!canvasCreated)return;

    if(historyIndex<history.length-1){
        history.splice(historyIndex+1);
    }

    try{

        const img=ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

        history.push(img);

        if(history.length>MAX_HISTORY){
            history.shift();
        }

        historyIndex=history.length-1;

    }catch(err){
        console.error(err);
    }
}

function undo(){

    if(historyIndex<=0)return;

    historyIndex--;

    ctx.putImageData(
        history[historyIndex],
        0,
        0
    );
}

function redo(){

    if(historyIndex>=history.length-1)return;

    historyIndex++;

    ctx.putImageData(
        history[historyIndex],
        0,
        0
    );
}

document.getElementById("undoBtn").onclick=undo;
document.getElementById("redoBtn").onclick=redo;

/* FLOOD FILL */
function floodFill(sx,sy){

    if(
        sx<0 ||
        sy<0 ||
        sx>=canvas.width ||
        sy>=canvas.height
    )return;

    const image=ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const data=image.data;

    const w=canvas.width;
    const h=canvas.height;

    const start=(sy*w+sx)*4;

    const tr=data[start];
    const tg=data[start+1];
    const tb=data[start+2];
    const ta=data[start+3];

    const rgb=hexToRgb(color);

    if(
        tr===rgb.r &&
        tg===rgb.g &&
        tb===rgb.b &&
        ta===255
    )return;

    function match(x,y){

        if(
            x<0 ||
            y<0 ||
            x>=w ||
            y>=h
        )return false;

        const i=(y*w+x)*4;

        return(
            data[i]===tr &&
            data[i+1]===tg &&
            data[i+2]===tb &&
            data[i+3]===ta
        );
    }

    const stack=[[sx,sy]];

    while(stack.length){

        const [x,y]=stack.pop();

        if(!match(x,y))continue;

        let left=x;

        while(left>=0 && match(left,y)){
            left--;
        }

        left++;

        let right=x;

        while(right<w && match(right,y)){
            right++;
        }

        right--;

        for(let px=left;px<=right;px++){

            const i=(y*w+px)*4;

            data[i]=rgb.r;
            data[i+1]=rgb.g;
            data[i+2]=rgb.b;
            data[i+3]=255;

            if(
                y>0 &&
                match(px,y-1)
            ){
                stack.push([px,y-1]);
            }

            if(
                y<h-1 &&
                match(px,y+1)
            ){
                stack.push([px,y+1]);
            }
        }
    }

    ctx.putImageData(image,0,0);
}

/* RENK DÖNÜŞÜM */
function hexToRgb(hex){

    hex=hex.replace("#","");

    return{
        r:parseInt(hex.substring(0,2),16),
        g:parseInt(hex.substring(2,4),16),
        b:parseInt(hex.substring(4,6),16)
    };
}

function rgbToHex(r,g,b){

    return "#"+
        [r,g,b]
        .map(n=>n.toString(16).padStart(2,"0"))
        .join("");
}

/* KAYDET */
document.getElementById("saveBtn").onclick=()=>{

    if(!canvasCreated)return;

    canvas.toBlob(blob=>{

        if(!blob)return;

        const url=URL.createObjectURL(blob);

        const a=document.createElement("a");

        a.href=url;
        a.download=
            "pixelpaint-"+
            canvas.width+
            "x"+
            canvas.height+
            ".png";

        document.body.appendChild(a);

        a.click();

        a.remove();

        setTimeout(()=>{
            URL.revokeObjectURL(url);
        },1000);

    },"image/png");
};

/* YÜKLE */
document.getElementById("loadBtn").onclick=()=>{

    fileInput.value="";
    fileInput.click();
};

fileInput.onchange=e=>{

    const file=e.target.files[0];

    if(!file)return;

    const image=new Image();

    image.onload=()=>{

        const w=image.naturalWidth;
        const h=image.naturalHeight;

        if(
            w<16 ||
            h<16 ||
            w>4096 ||
            h>4096
        ){

            alert(
                "Resim 16×16 ile 4096×4096 arasında olmalı."
            );

            URL.revokeObjectURL(image.src);

            return;
        }

        canvas.width=w;
        canvas.height=h;

        ctx.setTransform(1,0,0,1,0,0);
        ctx.imageSmoothingEnabled=false;

        ctx.fillStyle="#ffffff";
        ctx.fillRect(0,0,w,h);

        ctx.drawImage(image,0,0);

        canvasCreated=true;

        history.length=0;
        historyIndex=-1;

        saveHistory();

        updateStatus();

        startScreen.style.display="none";

        resetView();

        URL.revokeObjectURL(image.src);
    };

    image.onerror=()=>{
        alert("Resim yüklenemedi.");
        URL.revokeObjectURL(image.src);
    };

    image.src=URL.createObjectURL(file);
};

/* TAM EKRAN */
document.getElementById("fullscreenBtn").onclick=()=>{

    if(!document.fullscreenElement){

        if(document.documentElement.requestFullscreen){

            document.documentElement
                .requestFullscreen()
                .catch(err=>{
                    console.error(err);
                });
        }

    }else{

        if(document.exitFullscreen){
            document.exitFullscreen();
        }
    }
};

/* STATUS */
function updateStatus(){

    if(!canvasCreated)return;

    status.textContent=
        canvas.width+
        " × "+
        canvas.height+
        " px";
}

/* KLAVYE */
document.addEventListener("keydown",e=>{

    if(e.ctrlKey && e.key.toLowerCase()==="z"){

        e.preventDefault();
        undo();
    }

    if(e.ctrlKey && e.key.toLowerCase()==="y"){

        e.preventDefault();
        redo();
    }

    if(e.key==="Escape"){

        colorModal.style.display="none";

        drawing=false;
        activeDrawPointer=null;
        preview=null;
    }
});

updateSize();
updateTools();
